    <script>
      // Capture beforeinstallprompt globally as early as possible
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        console.log('Global beforeinstallprompt captured.');
        window.dispatchEvent(new Event('pwa-installable'));
      });

      // Register Service Worker on window load to avoid blocking initial render
      if ('serviceWorker' in navigator) {
        if (window.self === window.top) {
          const registerSW = () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(registration => {
                console.log('Service Worker registered successfully:', registration.scope);
                registration.update().catch(() => {});
              })
              .catch(error => {
                console.error('Service Worker registration failed:', error);
              });
          };

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW();
          } else {
            window.addEventListener('load', registerSW);
          }
        } else {
          navigator.serviceWorker.getRegistrations()
            .then(registrations => {
              for (const registration of registrations) {
                registration.unregister()
                  .then(success => {
                    if (success) console.log('Successfully cleaned up sandbox service worker.');
                  });
              }
            })
            .catch(() => {});
        }
      }
    </script>
